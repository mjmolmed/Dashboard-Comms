<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comunicaciones Cono Sur · Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  /* Paleta oficial Inchcape Brand Guidelines v1.0 (pág. 22): Dark Blue, Eco Blue, Electric Yellow + secundarios */
  --ic-dark-blue:#001a41; --ic-eco-blue:#18bde6; --ic-electric-yellow:#f2e400;
  --ic-green:#b6cd00; --ic-purple:#9e61a4; --ic-dark-grey:#394650; --ic-mid-grey:#848a8c;

  --surface-1:#fcfcfb; --page-plane:#f4f4f1; --surface-sidebar:var(--ic-dark-blue);
  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#898781;
  --grid-line:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,0.10);
  --series-1:var(--ic-eco-blue); --series-2:var(--ic-purple); --series-3:var(--ic-green); --series-4:var(--ic-electric-yellow);
  --series-5:#e87ba4; --series-6:var(--ic-dark-grey); --series-7:#4a3aa7; --series-8:#e34948;
  --status-good:#0ca30c; --status-warning:#fab219; --status-serious:#ec835a; --status-critical:#d03b3b;
  /* Rampa secuencial propia: de Inchcape Dark Blue (rango 1) a Eco Blue claro (cola del ranking) */
  --seq-100:#d6f1fa; --seq-150:#bfe9f7; --seq-200:#a3e0f5; --seq-250:#86d6f1; --seq-300:#63c8ec;
  --seq-350:#18bde6; --seq-400:#13a0c5; --seq-450:#0f82a3; --seq-500:#0c6482; --seq-550:#094a60;
  --seq-600:#06324a; --seq-650:#031f30; --seq-700:#001a41;
  --success-text:#006300;
  --radius:10px;
  --sidebar-w:252px;
  --font-brand:"Century Gothic","Avant Garde Gothic Pro","Jost","Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;}
body{background:var(--page-plane); color:var(--text-primary); font:14px/1.5 var(--font-brand);}
h1,h2,h3,h4{margin:0; font-weight:600;}
button{font-family:inherit;}
.app{display:flex; min-height:100vh;}

/* ---------- SIDEBAR ---------- */
.sidebar{
  width:var(--sidebar-w); flex:0 0 var(--sidebar-w); background:var(--surface-sidebar); color:#fff;
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.sidebar-brand{padding:22px 20px 16px; border-bottom:1px solid rgba(255,255,255,0.08);}
.sidebar-brand .brand-logo{height:26px; width:auto; display:block; margin-bottom:16px;}
.sidebar-brand .eyebrow{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ic-eco-blue); margin-bottom:4px; font-weight:600;}
.sidebar-brand .title{font-size:17px; font-weight:700; color:#fff; line-height:1.25;}
.sidebar-nav{padding:14px 10px; flex:1;}
.nav-group-label{font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:#6c7b98; padding:12px 10px 6px;}
.nav-link{
  display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; color:#c9d2e3;
  text-decoration:none; font-size:13.5px; margin-bottom:2px; cursor:pointer; border:none; background:none; width:100%; text-align:left;
}
.nav-link:hover{background:rgba(255,255,255,0.06); color:#fff;}
.nav-link.active{background:var(--series-1); color:var(--ic-dark-blue); font-weight:700;}
.nav-link .dot{width:7px; height:7px; border-radius:50%; background:currentColor; opacity:.55; flex:0 0 auto;}
.nav-link.active .dot{opacity:1;}
.sidebar-foot{padding:14px 16px 18px; border-top:1px solid rgba(255,255,255,0.08); font-size:11.5px; color:#8696b5;}
.sidebar-foot button{
  width:100%; background:rgba(255,255,255,0.08); color:#fff; border:1px solid rgba(255,255,255,0.14);
  border-radius:8px; padding:8px 10px; font-size:12px; cursor:pointer; margin-top:8px; text-align:left;
}
.sidebar-foot button:hover{background:rgba(255,255,255,0.16);}
#file-input{display:none;}

/* ---------- MAIN ---------- */
.main{flex:1; min-width:0; padding:26px 32px 60px;}
.page-header{margin-bottom:18px;}
.page-header .eyebrow{font-size:11.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-muted); font-weight:600;}
.page-header h1{font-size:25px; margin-top:4px;}
.page-header p{color:var(--text-secondary); margin-top:6px; max-width:760px;}

/* ---------- FILTER BAR ---------- */
.filter-bar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; background:var(--surface-1); border:1px solid var(--border); border-radius:var(--radius); padding:10px 12px; margin-bottom:20px;}
.filter-bar .flabel{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); margin-right:2px;}
details.fchip{position:relative;}
details.fchip summary{
  list-style:none; cursor:pointer; padding:6px 10px; border:1px solid var(--border); border-radius:7px;
  font-size:12.5px; color:var(--text-primary); background:#fff; display:flex; align-items:center; gap:6px;
}
details.fchip summary::-webkit-details-marker{display:none;}
details.fchip summary .count{background:var(--series-1); color:var(--ic-dark-blue); border-radius:999px; font-size:10.5px; padding:1px 6px; font-weight:700;}
details.fchip[open] summary{border-color:var(--series-1);}
.fpanel{
  position:absolute; top:calc(100% + 4px); left:0; background:#fff; border:1px solid var(--border); border-radius:9px;
  box-shadow:0 8px 24px rgba(0,0,0,0.12); padding:8px; min-width:220px; max-height:280px; overflow-y:auto; z-index:40;
}
.fpanel label{display:flex; align-items:center; gap:7px; padding:5px 6px; font-size:12.5px; border-radius:5px; cursor:pointer;}
.fpanel label:hover{background:var(--page-plane);}
.fpanel input[type=checkbox]{accent-color:var(--series-1);}
.btn-clear{padding:6px 12px; border-radius:7px; border:1px solid var(--border); background:#fff; font-size:12.5px; color:var(--text-secondary); cursor:pointer;}
.btn-clear:hover{border-color:var(--status-critical); color:var(--status-critical);}
.search-box{padding:6px 10px; border:1px solid var(--border); border-radius:7px; font-size:12.5px; min-width:190px; background:#fff;}
.filter-result-count{margin-left:auto; font-size:12px; color:var(--text-muted);}

/* ---------- HERO BANNER ---------- */
.hero-banner{
  position:relative; overflow:hidden; border-radius:16px;
  background:linear-gradient(135deg,var(--ic-dark-blue) 0%,#0a2d5c 55%,#0c3a73 100%);
  padding:38px 42px; margin-bottom:22px; color:#fff;
  display:flex; align-items:center; gap:40px; flex-wrap:wrap;
  box-shadow:0 14px 34px -14px rgba(0,26,65,0.45);
}
.hero-decoration{position:absolute; right:-50px; top:-60px; width:460px; height:auto; opacity:.6; pointer-events:none; mix-blend-mode:screen;}
.hero-main{position:relative; z-index:1;}
.hero-eyebrow{font-size:12px; letter-spacing:.09em; text-transform:uppercase; color:var(--ic-eco-blue); font-weight:700; margin-bottom:8px;}
.hero-figure{font-size:92px; font-weight:800; line-height:1; letter-spacing:-0.02em; font-variant-numeric:proportional-nums;}
.hero-figure-label{font-size:14px; color:#c7d6ef; margin-top:10px; max-width:280px; line-height:1.4;}
.hero-stats{display:flex; gap:30px; flex-wrap:wrap; position:relative; z-index:1; border-left:1px solid rgba(255,255,255,0.2); padding-left:34px;}
.hero-stat{min-width:92px;}
.hero-stat .hs-value{font-size:36px; font-weight:700; line-height:1; font-variant-numeric:proportional-nums;}
.hero-stat .hs-label{font-size:11.5px; color:#aebde0; margin-top:6px; max-width:130px; line-height:1.35;}
@media (max-width:980px){
  .hero-figure{font-size:64px;}
  .hero-stats{border-left:none; padding-left:0; border-top:1px solid rgba(255,255,255,0.2); padding-top:18px; width:100%;}
}

/* ---------- KPI ---------- */
.kpi-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(165px,1fr)); gap:12px; margin-bottom:22px;}
.kpi-card{background:var(--surface-1); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px;}
.kpi-card .kpi-value{font-size:30px; font-weight:700; letter-spacing:-0.01em; color:var(--text-primary); line-height:1.1;}
.kpi-card.accent{background:linear-gradient(145deg,var(--ic-dark-blue),#0c3a73); border-color:transparent;}
.kpi-card.accent .kpi-value{color:#fff;}
.kpi-card.accent .kpi-label{color:#aebde0;}
.kpi-card .kpi-label{font-size:12px; color:var(--text-secondary); margin-top:6px;}
.kpi-card .kpi-sub{font-size:11px; color:var(--text-muted); margin-top:2px;}

/* ---------- CARDS / SECTIONS ---------- */
.section-title{font-size:16px; font-weight:700; margin:28px 0 4px;}
.section-sub{font-size:12.5px; color:var(--text-secondary); margin-bottom:14px; max-width:720px;}
.grid-2{display:grid; grid-template-columns:1.3fr 1fr; gap:14px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
@media (max-width:1150px){.grid-2,.grid-3{grid-template-columns:1fr;}}
.card{background:var(--surface-1); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px;}
.card-title{font-size:13.5px; font-weight:700; margin-bottom:8px;}
.card-sub{font-size:11.5px; color:var(--text-muted); margin-top:-4px; margin-bottom:14px;}
.card-note{font-size:11px; color:var(--text-muted); margin-top:10px; border-top:1px dashed var(--grid-line); padding-top:8px;}

/* ---------- BAR CHART (horizontal ranking) ---------- */
.bar-row{display:grid; grid-template-columns:150px 1fr 56px; gap:10px; align-items:center; margin-bottom:7px; position:relative;}
.b-label{font-size:12px; color:var(--text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.b-track{height:20px; background:var(--grid-line); border-radius:4px; position:relative; overflow:hidden;}
.b-fill{height:100%; border-radius:4px 4px 4px 4px; transition:width .25s ease;}
.b-value{font-size:12px; color:var(--text-secondary); text-align:right; font-variant-numeric:tabular-nums;}
.bar-row:hover .b-track{outline:2px solid var(--series-1); outline-offset:1px;}

/* ---------- AREA RANKING (expandible por categoría) ---------- */
.area-rank{display:flex; flex-direction:column; gap:1px;}
.area-rank[hidden]{display:none;}
.area-rank-row{display:grid; grid-template-columns:16px 150px 1fr 56px; gap:10px; align-items:center; width:100%; background:none; border:none; padding:6px 4px; cursor:pointer; text-align:left; border-radius:6px; font:inherit;}
.area-rank-row:hover{background:var(--page-plane);}
.area-rank-chevron{display:inline-block; transition:transform .15s; color:var(--text-muted); font-size:11px;}
.area-rank-row[aria-expanded="true"] .area-rank-chevron{transform:rotate(90deg); color:var(--series-1);}
.area-rank-row .b-label{font-size:12px; color:var(--text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.area-rank-row .b-track{display:block; height:20px; background:var(--grid-line); border-radius:4px; overflow:hidden;}
.area-rank-row .b-fill{display:block; height:100%; border-radius:4px;}
.area-rank-row .b-value{font-size:12px; color:var(--text-secondary); text-align:right; font-variant-numeric:tabular-nums;}
.area-rank-detail{padding:2px 4px 14px 42px; border-bottom:1px dashed var(--grid-line); margin-bottom:3px;}
.area-rank-detail[hidden]{display:none;}
.area-rank-more{display:flex; align-items:center; gap:6px; width:100%; background:none; border:none; border-top:1px dashed var(--grid-line); padding:10px 4px 2px; margin-top:4px; cursor:pointer; font-size:12px; color:var(--series-1); font-weight:600; text-align:left; font-family:inherit;}
.area-rank-more:hover{color:var(--ic-dark-blue);}
.area-rank-more[aria-expanded="true"] .area-rank-chevron{transform:rotate(90deg); color:var(--series-1);}

/* ---------- CATEGORÍA DE GESTIÓN (chips, no barra) ---------- */
.cat-chip-row{display:flex; flex-wrap:wrap; gap:8px;}
.cat-chip{display:inline-flex; align-items:center; gap:7px; font-size:12px; color:var(--text-secondary); background:var(--page-plane); border:1px solid var(--border); border-radius:999px; padding:6px 13px;}
.cat-chip-dot{width:8px; height:8px; border-radius:50%; flex:0 0 auto;}
.cat-chip strong{color:var(--text-primary); font-weight:700;}
.donut-wrap{display:flex; align-items:center; gap:26px; flex-wrap:wrap;}
.donut-legend{display:flex; flex-direction:column; gap:9px;}
.donut-legend-item{font-size:12.5px; color:var(--text-secondary); display:flex; align-items:center; gap:9px;}
.donut-legend-dot{width:10px; height:10px; border-radius:50%; flex:0 0 auto;}
.donut-legend-item strong{color:var(--text-primary); font-weight:700; margin-left:4px;}

/* ---------- EVENT IMPACT CARDS ---------- */
.impact-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin-bottom:10px;}
.impact-card{background:var(--surface-1); border:1px solid var(--border); border-top:3px solid var(--ic-eco-blue); border-radius:var(--radius); padding:20px 20px 16px;}
.impact-card.clickable{cursor:pointer; transition:box-shadow .15s, transform .15s;}
.impact-card.clickable:hover{box-shadow:0 8px 20px -6px rgba(0,26,65,0.25); transform:translateY(-2px);}
.impact-value{font-size:44px; font-weight:800; line-height:1; color:var(--ic-dark-blue); letter-spacing:-0.01em; font-variant-numeric:proportional-nums;}
.impact-label{font-size:13.5px; font-weight:700; color:var(--text-primary); margin-top:6px;}
.impact-split-bar{display:flex; height:7px; border-radius:4px; overflow:hidden; margin-top:14px; background:var(--grid-line);}
.impact-split-legend{font-size:11px; color:var(--text-muted); margin-top:6px;}
.impact-eval{font-size:12px; font-weight:700; color:var(--ic-dark-blue); margin-top:10px; padding-top:9px; border-top:1px dashed var(--grid-line);}

/* ---------- LINE CHART ---------- */
.linechart-wrap{width:100%; overflow-x:auto;}
.line-tooltip{position:absolute; background:#17233c; color:#fff; font-size:11.5px; padding:6px 9px; border-radius:6px; pointer-events:none; opacity:0; transition:opacity .1s; white-space:nowrap; z-index:50;}

/* ---------- STATUS BADGE ---------- */
.badge{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:3px 9px; border-radius:999px; white-space:nowrap;}
.badge .bd{width:7px; height:7px; border-radius:50%;}

/* ---------- TABLE ---------- */
.table-toolbar{display:flex; gap:8px; align-items:center; margin-bottom:10px; flex-wrap:wrap;}
.table-scroll{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); background:#fff;}
table.data-table{width:100%; border-collapse:collapse; font-size:12.5px; min-width:760px;}
table.data-table th{
  text-align:left; padding:10px 12px; background:#f6f6f4; border-bottom:1px solid var(--border); color:var(--text-secondary);
  font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; cursor:pointer; white-space:nowrap; user-select:none;
}
table.data-table th:hover{color:var(--series-1);}
table.data-table td{padding:9px 12px; border-bottom:1px solid var(--grid-line); vertical-align:top;}
table.data-table tr:hover td{background:#fafaf8;}
.pagination{display:flex; align-items:center; gap:10px; margin-top:12px; font-size:12.5px; color:var(--text-secondary);}
.pagination button{padding:5px 10px; border:1px solid var(--border); background:#fff; border-radius:6px; cursor:pointer;}
.pagination button:disabled{opacity:.4; cursor:default;}

/* ---------- AGENCY CARDS ---------- */
.agency-card{background:var(--surface-1); border:1px solid var(--border); border-radius:12px; padding:20px; display:flex; flex-direction:column; gap:10px;}
.agency-card .ag-name{font-size:16px; font-weight:700;}
.agency-card .ag-badge{font-size:11px; padding:3px 9px; border-radius:999px; font-weight:600; width:fit-content;}
.agency-card .ag-metric{display:flex; justify-content:space-between; font-size:12.5px; padding:5px 0; border-bottom:1px dashed var(--grid-line);}
.agency-card a.ag-link{margin-top:6px; font-size:12.5px; color:var(--series-1); font-weight:600; text-decoration:none;}
.agency-card a.ag-link:hover{text-decoration:underline;}

/* ---------- EMPTY STATE ---------- */
.empty-state{background:var(--surface-1); border:1.5px dashed var(--baseline); border-radius:12px; padding:48px 30px; text-align:center;}
.empty-state .es-icon{font-size:34px; margin-bottom:10px;}
.empty-state h3{font-size:17px; margin-bottom:8px;}
.empty-state p{color:var(--text-secondary); max-width:440px; margin:0 auto;}
.empty-state .es-badge{display:inline-block; margin-top:14px; padding:5px 14px; border-radius:999px; background:#fdf1dc; color:#8a5a00; font-size:12px; font-weight:700;}

/* ---------- EK TIMELINE ---------- */
.ek-month{margin-bottom:18px;}
.ek-month-head{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
.ek-month-head h4{font-size:13.5px;}
.ek-month-head .ek-count{font-size:11px; background:var(--series-1); color:var(--ic-dark-blue); padding:2px 9px; border-radius:999px; font-weight:700;}
.ek-items{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px;}
.ek-items li{font-size:12.5px; color:var(--text-primary); padding:9px 12px; background:#fff; border:1px solid var(--border); border-radius:7px; line-height:1.45;}

/* ---------- MODAL (detalle al pinchar una tarjeta/barra de eventos) ---------- */
.modal-backdrop{position:fixed; inset:0; background:rgba(11,11,11,0.55); display:flex; align-items:center; justify-content:center; z-index:200; padding:20px;}
.modal-backdrop[hidden]{display:none;}
.modal-box{background:#fff; border-radius:14px; max-width:760px; width:100%; max-height:82vh; display:flex; flex-direction:column; box-shadow:0 24px 60px rgba(0,0,0,0.32);}
.modal-head{display:flex; align-items:flex-start; justify-content:space-between; gap:14px; padding:18px 22px; border-bottom:1px solid var(--border);}
.modal-head h3{font-size:16px;}
.modal-head p{font-size:12px; color:var(--text-secondary); margin-top:4px;}
.modal-close{background:none; border:none; font-size:16px; cursor:pointer; color:var(--text-muted); padding:5px 9px; border-radius:7px; flex:0 0 auto;}
.modal-close:hover{background:var(--page-plane); color:var(--text-primary);}
.modal-body{padding:16px 22px 22px; overflow-y:auto;}
.clickable-hint{display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700; color:var(--ic-dark-blue); background:#e3f6fc; border:1px solid var(--ic-eco-blue); border-radius:999px; padding:5px 12px; margin-top:10px;}
.clickable-hint-top{margin-top:0; margin-bottom:10px;}
.clickable-chart .bar-row{cursor:pointer;}
.modal-filter-chip{font-size:11.5px; padding:4px 11px; border-radius:999px; border:1px solid var(--border); background:#fff; color:var(--text-secondary); cursor:pointer;}
.modal-filter-chip.active{background:var(--series-1); color:var(--ic-dark-blue); border-color:var(--series-1); font-weight:700;}
.modal-toolbar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px;}

/* ---------- MISC ---------- */
.toast{position:fixed; bottom:20px; right:20px; background:#17233c; color:#fff; padding:12px 18px; border-radius:9px; font-size:13px; box-shadow:0 8px 24px rgba(0,0,0,0.2); z-index:100; max-width:340px;}
.tag-row{display:flex; flex-wrap:wrap; gap:6px;}
.tag{font-size:11px; padding:3px 9px; border-radius:999px; background:#eef1f7; color:var(--text-secondary);}
.hr{height:1px; background:var(--grid-line); margin:22px 0;}
@media (max-width:980px){
  .app{flex-direction:column;}
  .sidebar{width:100%; flex:none; height:auto; position:relative; flex-direction:row; overflow-x:auto; align-items:center;}
  .sidebar-brand{border-bottom:none; border-right:1px solid rgba(255,255,255,0.08); flex:0 0 auto;}
  .sidebar-nav{display:flex; padding:10px; flex:1;}
  .nav-group-label{display:none;}
  .nav-link{white-space:nowrap;}
  .sidebar-foot{display:none;}
  .main{padding:18px;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <img class="brand-logo" id="brand-logo" alt="Inchcape" src="">
      <div class="eyebrow">Cono Sur · Comunicaciones</div>
      <div class="title">Dashboard de gestión</div>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-foot" id="sidebar-foot">
      <div id="data-meta"></div>
      <button id="btn-upload">📂 Actualizar datos (subir Excel)</button>
      <button id="btn-reset" style="display:none;">↺ Restaurar datos originales</button>
      <input type="file" id="file-input" accept=".xlsx,.xls">
    </div>
  </aside>
  <main class="main">
    <div id="page-root"></div>
  </main>

--------------------------------------------------------------------------- */
const MESES_ORDEN = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

function stripAccents(s){ return s.normalize("NFD").replace(/[̀-ͯ]/g,""); }

function normalizeMes(raw){
  if(!raw) return null;
  let t = raw.toString().trim();
  if(!t) return null;
  if(/^abri$/i.test(t)) t = "Abril"; // typo real detectado en el Excel
  const found = MESES_ORDEN.find(m => stripAccents(m).toLowerCase() === stripAccents(t).toLowerCase());
  return found || null;
}

const STATUS_RULES = [
  { test:/complet/i,  key:"completado",  label:"Completado",  color:"var(--status-good)",    order:1 },
  { test:/proceso/i,  key:"en_proceso",  label:"En proceso",  color:"var(--series-1)",        order:2 },
  { test:/pausad/i,   key:"pausado",     label:"Pausado",     color:"var(--status-warning)",  order:3 },
  { test:/iniciar/i,  key:"por_iniciar", label:"Por iniciar", color:"var(--text-muted)",       order:4 },
  { test:/cancel/i,   key:"cancelado",   label:"Cancelado",   color:"var(--status-critical)",  order:5 }
];
function normalizeStatus(raw){
  const t = (raw || "").toString().trim();
  for(const r of STATUS_RULES){ if(r.test.test(t)) return r; }
  return { key:"sin_estado", label:"Sin estado", color:"var(--text-muted)", order:6 };
}

function normalizeAccion(raw){
  const t = (raw || "").toString().trim();
  if(!t) return "Sin especificar";
  const key = stripAccents(t).toLowerCase();
  if(ACCION_INVALIDOS.has(key)) return "Sin especificar";
  return ACCION_CANON[key] || t;

  "f&i & lifecycle":"F&I & Lifecycle", "automotriz":"Automotriz", "regional":"Regional",
  "regional comms":"Regional", "retail":"Retail", "retail & network":"Retail & Network",
  "directores":"Directores", "3pd":"3PD", "hse":"HSE", "compliance":"Compliance",
  "sindicatos":"Sindicatos", "strategy & development":"Strategy & Development", "red mujeres in":"Red Mujeres IN",
  "cono sur y maq":"Conosur + Maquinaria", "conosur + maq":"Conosur + Maquinaria", "cono sur + maq":"Conosur + Maquinaria"
};
function normalizeDireccion(raw){
  const t = (raw || "").toString().trim();
  if(!t) return "Sin especificar";
  const key = stripAccents(t).toLowerCase().replace(/\s+/g," ");
  if(DIRECCION_CANON[key]) return DIRECCION_CANON[key];
  return t;
}

// "Área solicitante" (Tareas (2)) reemplaza a la vieja "Dirección" como eje principal de
// clasificación -> a pedido explícito de la usuaria, porque la anterior tenía demasiadas
// aperturas. Solo se funden variantes de escritura del mismo valor real (no se inventa taxonomía).
const AREA_SOLICITANTE_CANON = {
  "argentina + uruguay":"Argentina + Uruguay", "argentina y uruguay":"Argentina + Uruguay"
};
function normalizeAreaSolicitante(raw){
  const t = (raw || "").toString().trim().replace(/\s+/g," ");
  if(!t) return "Sin especificar";
  const key = stripAccents(t).toLowerCase();
  if(AREA_SOLICITANTE_CANON[key]) return AREA_SOLICITANTE_CANON[key];
  return t;
}
function normalizeCategoriaTarea(raw){
  const t = (raw || "").toString().trim();
  return t || "Sin especificar";
}
function derivePais(direccionCanon){
  // "País/mercado" incluye Maquinaria como un mercado más, junto a los 3 países (a pedido explícito de la usuaria).
  // Desde que "Área solicitante" reemplazó a "Dirección", los valores son compuestos
  // ("Chile Automotive Premium", "MQ Gerencia General") -> se deriva solo cuando es inequívoco
  // (prefijo Chile/MQ, o el país solo) y se deja afuera cualquier combo/área funcional (People, Regional, etc.)
  if(!direccionCanon) return null;
  if(direccionCanon === "Argentina") return "Argentina";
  if(direccionCanon === "Uruguay") return "Uruguay";
  if(direccionCanon === "Maquinaria") return "Maquinaria";
  if(/^chile\b/i.test(direccionCanon)) return "Chile";
  if(/^mq\b/i.test(direccionCanon)) return "Maquinaria";
  return null;
}
function parseFechaEjecucion(raw){
  const t = (raw || "").toString().trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(t)) return t;
  return null;
}

/* ---------------------------------------------------------------------------
   2. PROCESAMIENTO
--------------------------------------------------------------------------- */
function buildInternalActions(rawRows){
  // Solo se considera información de 2026 (a pedido explícito de la usuaria) -> Tareas (2)
  // trae de arrastre ~116 filas de 2025 (tareas que se ejecutaron en nov/dic 2025 pero quedaron
  // registradas en la planificación 2026) que no deben contarse en este tablero.
  const rows2026 = rawRows.filter(r => (r.anio||"").toString().trim() === "2026");
  const actions = rows2026.map((r,i) => {
    const mes = normalizeMes(r.mes);
    // "direccion" ahora se alimenta de "Área solicitante" (Tareas (2)) en vez de la vieja
    // columna "Dirección" -> mismo nombre de campo internamente para no tener que renombrar
    // filtros/rankings/tabla en toda la app, pero la fuente real cambió.
    const direccionRaw = r.areaSolicitante!=null ? r.areaSolicitante : r.direccion;
    const direccion = r.areaSolicitante!=null ? normalizeAreaSolicitante(r.areaSolicitante) : normalizeDireccion(r.direccion);
    const status = normalizeStatus(r.status);
    return {
      id:"int-"+i,
      anio: (r.anio||"").toString().trim() || "2026",
      mesRaw: r.mes, mes,
      mesIndex: mes ? MESES_ORDEN.indexOf(mes) : null,
      accionRaw: r.accion, accion: normalizeAccion(r.accion),
      direccionRaw, direccion,
      categoria: normalizeCategoriaTarea(r.categoria),
      pais: derivePais(direccion),
      descripcion: (r.descripcion||"").toString().trim(),
      statusRaw: r.status, status: status.key, statusLabel: status.label, statusColor: status.color, statusOrder: status.order,
      fecha: parseFechaEjecucion(r.fecha), fechaRaw: r.fecha
    };
  });
  dedupeAccentVariants(actions);
  return actions;
}

// Dos filas con el mismo texto salvo tildes/mayúsculas (ej. "Líderes Conosur" vs
// "Lideres Conosur") son la misma categoría real -> se funden bajo la grafía más
// usada, sin necesidad de listar cada caso a mano en DIRECCION_CANON.
function dedupeAccentVariants(actions){
  const groups = new Map(); // key sin tilde/minúscula -> Map(forma original -> conteo)
  for(const a of actions){
    const key = stripAccents(a.direccion).toLowerCase();
    if(!groups.has(key)) groups.set(key, new Map());
    const g = groups.get(key);
    g.set(a.direccion, (g.get(a.direccion)||0)+1);
  }
  const canonical = new Map();
  for(const [key, forms] of groups){
    if(forms.size<=1) continue;
    const best = [...forms.entries()].sort((a,b)=>b[1]-a[1])[0][0];
    canonical.set(key, best);
  }
  for(const a of actions){
    const key = stripAccents(a.direccion).toLowerCase();
    if(canonical.has(key)){ a.direccion = canonical.get(key); a.pais = derivePais(a.direccion); }
  }
}

function buildEkReport(rawMonths){
  return (rawMonths||[]).map(m => ({
    mes: m.mes.charAt(0) + m.mes.slice(1).toLowerCase(),
    items: m.items || []
  }));
}

function buildEfimeroReport(rawMonths){
  return (rawMonths||[]).map(m => ({
    mes: m.mes.charAt(0) + m.mes.slice(1).toLowerCase(),
    items: (m.items||[]).map(it => ({ categoria: (it.categoria||"").toString().trim() || "Sin categoría", item: (it.item||"").toString().trim() }))
  }));
}

// La columna "Evaluación" de Mapping Completo mezcla notas numéricas con estados de texto
// ("No aplica", "No se envió") y, en varias filas, nombres de persona cargados por error
// (ej. "JOSE") -> se detectan para no confundirlos con una nota real.
function parseEvaluacion(raw){
  const t = (raw||"").toString().trim();
  if(!t) return {status:'sin_dato', numeric:null};
  if(/^\d+([.,]\d+)?$/.test(t)) return {status:'numerica', numeric: parseFloat(t.replace(',','.'))};
  if(/no aplica/i.test(t)) return {status:'no_aplica', numeric:null};
  if(/no se envi/i.test(t)) return {status:'no_enviada', numeric:null};
  if(/sin evaluaci/i.test(t) || /^n\/a$/i.test(t)) return {status:'sin_evaluacion', numeric:null};
  return {status:'dato_no_valido', numeric:null};
}

// Estado de cada instancia de Mapping Completo: no viene como columna en el Excel, se deriva.
// "Cancelado" = la celda de Categoría está en rojo en el Excel (marca visual de la usuaria,
// detectada por color de fuente al leer el archivo -> viene ya resuelta en r.cancelado).
// Si no está cancelado: fecha pasada (<= hoy) = "Realizado"; fecha futura o sin fecha
// confirmada (TBC/vacía) = "Planificado" (a pedido explícito de la usuaria).
function deriveEventoEstado(cancelado, fechaIso){
  if(cancelado) return {key:'cancelado', label:'Cancelado', color:'var(--status-critical)'};
  if(!fechaIso) return {key:'planificado', label:'Planificado', color:'var(--status-warning)'};
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const f = new Date(fechaIso+"T00:00:00");
  if(f.getTime() > hoy.getTime()) return {key:'planificado', label:'Planificado', color:'var(--status-warning)'};
  return {key:'realizado', label:'Realizado', color:'var(--status-good)'};
}

function buildEventosMapping(rawRows){
  return (rawRows||[]).map((r,i) => {
    const direccionRaw = (r.direccion||"").toString().trim();
    const fecha = (r.fecha||"").toString().trim();
    const cancelado = !!r.cancelado;
    const estado = deriveEventoEstado(cancelado, fecha);
    const nombre = (r.nombre||"").toString().trim();
    return {
      id:"ev-"+i,
      categoria: (r.categoria||"").toString().trim(),
      mes: normalizeMes(r.mes),
      fecha,
      nombre,
      // "Encuentro de Líderes" es un sub-tipo de "Evento" identificado por el nombre del
      // instancia (no es una categoría propia en el Excel) -> se marca aparte para poder
      // mostrarlo como su propio corte sin inventar una categoría que no está en la fuente.
      esEncuentroLideres: /encuentro de l[ií]deres/i.test(nombre),
      cluster: (r.cluster||"").toString().trim() || "Sin especificar",
      mercado: (r.mercado||"").toString().trim() || "Sin especificar",
      direccion: direccionRaw || "Sin especificar",
      publico: (r.publico||"").toString().trim(),
      quienInvita: (r.quieninvita||"").toString().trim(),
      participantes: parseInt(r.participantes,10) || null,
      ubicacion: (r.ubicacion||"").toString().trim(),
      evaluacion: parseEvaluacion(r.evaluacion),
      comentarios: (r.comentarios||"").toString().trim(),
      cancelado, estado: estado.key, estadoLabel: estado.label, estadoColor: estado.color
    };
  });
}

function groupCount(arr, keyFn){
  const map = new Map();
  for(const item of arr){
    const k = keyFn(item);
    map.set(k, (map.get(k)||0) + 1);
  }
  return [...map.entries()].map(([label,value]) => ({label,value})).sort((a,b)=>b.value-a.value);
}

function pct(n, total){ return total ? Math.round((n/total)*1000)/10 : 0; }
function fmt(n){ return n.toLocaleString("es-CL"); }

function applyFilters(actions){

  return actions.filter(a =>

    (f.direccion.size===0 || f.direccion.has(a.direccion)) &&

    (f.status.size===0 || f.status.has(a.statusLabel)) &&

  );

function renderFilterBar(){
  const f = STATE.filters;
  const opt = (field, label, extractor) => {
    const values = groupCount(STATE.internal, extractor).filter(v=>v.label);
    const selected = f[field];
    return `<details class="fchip" data-field="${field}" ${STATE.openFilter===field?'open':''}>
      <summary>${label} ${selected.size? `<span class="count">${selected.size}</span>`:''}</summary>
      <div class="fpanel">
        ${values.map(v=>`<label><input type="checkbox" value="${esc(v.label)}" ${selected.has(v.label)?'checked':''}> ${esc(v.label)} <span style="color:var(--text-muted);margin-left:auto">${v.value}</span></label>`).join("")}
      </div>
    </details>`;
  };
  const html = `
    <span class="flabel">Filtros:</span>
    ${opt('mes','Período', a=>a.mes||'Sin mes')}
    ${opt('direccion','Área solicitante',a=>a.direccion)}
    ${opt('categoria','Categoría',a=>a.categoria)}
    ${opt('accion','Tipo de acción',a=>a.accion)}
    ${opt('status','Estado',a=>a.statusLabel)}
    ${opt('pais','País',a=>a.pais||'Sin país')}
    <button class="btn-clear" id="btn-clear-filters">Limpiar filtros</button>
    <span class="filter-result-count" id="filter-result-count"></span>
  `;
  return html;
}
function wireFilterBar(container, onChange){
  container.querySelectorAll('details.fchip').forEach(d=>{
    d.addEventListener('toggle', ()=>{ STATE.openFilter = d.open ? d.dataset.field : null; });
  });
  container.querySelectorAll('.fpanel input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', e=>{
      const field = e.target.closest('details').dataset.field;
      const val = e.target.value;
      if(e.target.checked) STATE.filters[field].add(val); else STATE.filters[field].delete(val);
      STATE.openFilter = field;
      onChange();
    });
  });
  const clearBtn = container.querySelector('#btn-clear-filters');
  if(clearBtn) clearBtn.addEventListener('click', ()=>{ STATE.openFilter=null; clearFilters(); });
}

/* ---------------------------------------------------------------------------
   5. CHART PRIMITIVES (SVG, siguiendo spec: barras finas, extremos 4px,
      gap 2px, gridlines hairline, leyenda >=2 series, tooltip en hover)
--------------------------------------------------------------------------- */
function esc(s){ return (s==null?"":s.toString()).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const SEQ_STEPS = ["--seq-700","--seq-600","--seq-550","--seq-500","--seq-450","--seq-400","--seq-350","--seq-300","--seq-250","--seq-200","--seq-150","--seq-100"];

function barChartHorizontal(items, opts={}){
  const total = items.reduce((s,i)=>s+i.value,0);
  const max = opts.max || Math.max(...items.map(i=>i.value), 1);
  const fmtVal = opts.valueFormatter || fmt;
  const rows = items.map((it,idx)=>{
    const color = opts.color || `var(${SEQ_STEPS[Math.min(idx,SEQ_STEPS.length-1)]})`;
    const widthPct = Math.max((it.value/max)*100, 2);
    const tip = opts.showPercent===false ? `${esc(it.label)}: ${fmtVal(it.value)}` : `${esc(it.label)}: ${fmt(it.value)} (${pct(it.value,total)}%)`;
    return `<div class="bar-row ${idx===0?'top':''}" title="${tip}" data-label="${esc(it.label)}">
      <div class="b-label">${esc(it.label)}</div>
      <div class="b-track"><div class="b-fill" style="width:${widthPct}%; background:${color}"></div></div>
      <div class="b-value">${fmtVal(it.value)}</div>
    </div>`;
  }).join("");
  return `<div class="bar-chart">${rows}</div>`;
}

function lineChartSVG(points, opts={}){
  // points: [{label, value, sub}]
  const w = opts.width || 720, h = opts.height || 220, padL=40, padR=24, padT=18, padB=30;
  const innerW = w-padL-padR, innerH = h-padT-padB;
  const max = Math.max(...points.map(p=>p.value), 1);
  const niceMax = Math.ceil(max/10)*10 || 10;
  const stepX = points.length>1 ? innerW/(points.length-1) : 0;
  const coords = points.map((p,i)=>({
    x: padL + stepX*i,
    y: padT + innerH - (p.value/niceMax)*innerH,
    ...p
  }));
  const path = coords.map((c,i)=> (i===0?'M':'L')+c.x.toFixed(1)+' '+c.y.toFixed(1)).join(' ');
  const gridLines = [0,0.25,0.5,0.75,1].map(f=>{
    const y = padT + innerH*(1-f);
    const val = Math.round(niceMax*f);
    return `<line x1="${padL}" x2="${w-padR}" y1="${y}" y2="${y}" stroke="var(--grid-line)" stroke-width="1"/>
      <text x="${padL-8}" y="${y+4}" font-size="10.5" fill="var(--text-muted)" text-anchor="end">${val}</text>`;
  }).join("");
  const labels = coords.map(c=>`<text x="${c.x}" y="${h-10}" font-size="10.5" fill="var(--text-muted)" text-anchor="middle">${esc(c.label.slice(0,3))}</text>`).join("");
  const dots = coords.map((c,i)=>`<circle class="line-pt" data-i="${i}" cx="${c.x}" cy="${c.y}" r="4" fill="var(--series-1)" stroke="var(--surface-1)" stroke-width="2" style="cursor:pointer"/>`).join("");
  const endLabel = coords.length? `<text x="${coords[coords.length-1].x}" y="${coords[coords.length-1].y-10}" font-size="11.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">${coords[coords.length-1].value}</text>` : '';
  const id = 'lc'+Math.random().toString(36).slice(2,8);
  return `<div class="linechart-wrap" style="position:relative" id="${id}">
    <svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
      ${gridLines}
      <path d="${path}" fill="none" stroke="var(--series-1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${dots}
      ${endLabel}
      ${labels}
    </svg>
    <div class="line-tooltip" id="${id}-tt"></div>
  </div>
  <script>(function(){
    const root=document.getElementById(${JSON.stringify(id)});
    const tt=document.getElementById(${JSON.stringify(id+'-tt')});
    const pts=${JSON.stringify(coords.map(c=>({x:c.x,y:c.y,label:c.label,value:c.value,sub:c.sub||''})))};
    root.querySelectorAll('.line-pt').forEach((dot,i)=>{
      dot.addEventListener('mouseenter', e=>{
        const p=pts[i];
        tt.style.opacity=1;
        tt.style.left=(p.x+8)+'px'; tt.style.top=(p.y-28)+'px';
        tt.innerHTML='<strong>'+p.label+'</strong>: '+p.value+(p.sub? ' · '+p.sub:'');
      });
      dot.addEventListener('mouseleave', ()=>{ tt.style.opacity=0; });
    });
  })();<\/script>`;
}

function heroRings(){
  return `<img class="hero-decoration" src="${HALO_RING_PNG}" alt="" />`;
}

function animateCountUps(root){
  (root||document).querySelectorAll('[data-countup]').forEach(el=>{
    const target = parseFloat(el.dataset.countup);
    if(isNaN(target)) return;
    const start = performance.now();
    const duration = 850;
    function tick(now){
      const p = Math.min((now-start)/duration, 1);
      const eased = 1 - Math.pow(1-p, 3);
      el.textContent = fmt(Math.round(target*eased));
      if(p<1) requestAnimationFrame(tick); else el.textContent = fmt(target);
    }
    requestAnimationFrame(tick);
  });
}

function statTile(label, value, sub, accent, countupRaw){
  const valueHtml = (typeof countupRaw === 'number' && isFinite(countupRaw))
    ? `<span data-countup="${countupRaw}">0</span>` : value;
  return `<div class="kpi-card ${accent?'accent':''}">
    <div class="kpi-value">${valueHtml}</div>
    <div class="kpi-label">${esc(label)}</div>
    ${sub? `<div class="kpi-sub">${sub}</div>`:''}
  </div>`;
}

  direccion: e => esc(e.direccion),
  quienInvita: e => esc(e.quienInvita||'—'),
  evaluacion: e => evaluacionTexto(e.evaluacion),
  estado: e => `<span class="badge" style="background:color-mix(in srgb, ${e.estadoColor} 16%, white); color:${e.estadoColor}"><span class="bd" style="background:${e.estadoColor}"></span>${esc(e.estadoLabel)}</span>`
};
// `categoria`: si todas las filas son de la misma categoría (al abrir desde una tarjeta de
// tipo), usa su set de columnas específico; si se mezclan categorías (ej. "por dirección"), usa
// el set completo por defecto.
function eventDetailTable(items, categoria){
  if(!items.length) return '<p style="color:var(--text-muted)">Sin instancias para este corte.</p>';
  const cols = EVENT_TABLE_COLS[categoria] || EVENT_TABLE_COLS.DEFAULT;
  const sorted = [...items].sort((a,b)=> (a.fecha||'9999').localeCompare(b.fecha||'9999'));
  return `<div class="table-scroll"><table class="data-table">
    <thead><tr>${cols.map(c=>`<th>${EVENT_COL_LABEL[c]}</th>`).join("")}</tr></thead>
    <tbody>${sorted.map(e=>`<tr>${cols.map(c=>`<td>${EVENT_COL_RENDER[c](e)}</td>`).join("")}</tr>`).join("")}</tbody>
  </table></div>`;
}
function avgEvaluacion(items){
  const nums = items.map(e=>e.evaluacion.numeric).filter(v=>v!=null);
  return { prom: nums.length? nums.reduce((s,v)=>s+v,0)/nums.length : null, n: nums.length };
}
// Modal de detalle CON filtro interno (no solo un listado estático): búsqueda + toggle de
// estado + toggle de dirección, para poder acotar el listado en vez de scrollear todo.
const ESTADO_FILTRO_OPTS = [
  {key:'realizado', label:'Realizado'},
  {key:'planificado', label:'Planificado'},
  {key:'cancelado', label:'Cancelado'}
];
function openEventDrilldown(title, items, categoria){
  ensureModalRoot();
  const modalState = { search:'', estado:new Set(), direccion:new Set() };
  const direccionesDisponibles = groupCount(items, e=>e.direccion).map(d=>d.label);

  function renderModalBody(){
    let rows = items;
    if(modalState.estado.size) rows = rows.filter(e=>modalState.estado.has(e.estado));
    if(modalState.direccion.size) rows = rows.filter(e=>modalState.direccion.has(e.direccion));
    if(modalState.search){
      const q = stripAccents(modalState.search.toLowerCase());
      rows = rows.filter(e => stripAccents([e.direccion,e.publico,e.categoria,e.comentarios].join(' ').toLowerCase()).includes(q));
    }
    const evalAll = avgEvaluacion(items);
    const evalRows = avgEvaluacion(rows);
    const filtroActivo = modalState.estado.size || modalState.direccion.size || modalState.search;
    const body = document.getElementById('modal-body');
    body.innerHTML = `
      <div class="modal-toolbar">
        <input class="search-box" id="modal-search" placeholder="Buscar por dirección, público…" value="${esc(modalState.search)}">
        ${ESTADO_FILTRO_OPTS.map(o=>`<button type="button" class="modal-filter-chip ${modalState.estado.has(o.key)?'active':''}" data-kind="estado" data-value="${o.key}">${o.label}</button>`).join("")}
      </div>
      ${direccionesDisponibles.length>1? `
      <div class="modal-toolbar">
        ${direccionesDisponibles.map(d=>`<button type="button" class="modal-filter-chip ${modalState.direccion.has(d)?'active':''}" data-kind="direccion" data-value="${esc(d)}">${esc(d)}</button>`).join("")}
      </div>` : ''}
      <div style="font-size:12px; color:var(--text-muted); margin-bottom:4px">${fmt(rows.length)} de ${fmt(items.length)} instancias</div>
      <div style="font-size:12.5px; color:var(--text-primary); margin-bottom:10px">
        Evaluación promedio${filtroActivo? ' (con filtro)':''}: <strong>${evalRows.prom!=null? evalRows.prom.toFixed(2):'—'}</strong> <span style="color:var(--text-muted)">(${fmt(evalRows.n)} evaluados)</span>
        ${filtroActivo? ` · general sin filtrar: <strong>${evalAll.prom!=null? evalAll.prom.toFixed(2):'—'}</strong> <span style="color:var(--text-muted)">(${fmt(evalAll.n)} evaluados)</span>` : ''}
      </div>
      ${eventDetailTable(rows, categoria)}
    `;
    body.querySelector('#modal-search').addEventListener('input', e=>{
      modalState.search = e.target.value; renderModalBody(); preserveFocus('#modal-search');
    });
    body.querySelectorAll('.modal-filter-chip').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const set = modalState[btn.dataset.kind];
        if(set.has(btn.dataset.value)) set.delete(btn.dataset.value); else set.add(btn.dataset.value);
        renderModalBody();
      });
    });
  }
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-subtitle').textContent = `${fmt(items.length)} instancias en total`;
  document.getElementById('event-modal-backdrop').hidden = false;
  renderModalBody();
}

// Click para "hacer zoom": tarjetas de categoría + la tarjeta de Encuentro de Líderes +

function eventImpactCards(eventos){
  const colors = {'Cono Sur':'var(--ic-eco-blue)', 'Maquinaria':'var(--ic-dark-grey)'};
  const porTipo = groupCount(eventos, e=>e.categoria);

  const cards = porTipo.map(t=>{
    const items = eventos.filter(e=>e.categoria===t.label);
    // el número protagonista de la tarjeta es lo REALIZADO (no cuenta planificado ni cancelado)
    const realizados = items.filter(e=>e.estado==='realizado');
    const planificados = items.filter(e=>e.estado==='planificado');
    const cancelados = items.filter(e=>e.estado==='cancelado');
    const porCluster = groupCount(realizados, e=>e.cluster);
    const segTotal = porCluster.reduce((s,p)=>s+p.value,0) || 1;
    const bar = porCluster.map(p=>`<div style="width:${(p.value/segTotal)*100}%; background:${colors[p.label]||'var(--text-muted)'}"></div>`).join('<div style="width:2px;background:var(--surface-1)"></div>');
    const legend = porCluster.map(p=>`${esc(p.label)} ${fmt(p.value)}`).join(' · ');
    const estadoBits = [
      planificados.length? `<span style="color:var(--status-warning)">${fmt(planificados.length)} planificados</span>` : null,
      cancelados.length? `<span style="color:var(--status-critical)">${fmt(cancelados.length)} cancelados</span>` : null
    ].filter(Boolean).join(' · ');
    return `<div class="impact-card clickable" data-categoria="${esc(t.label)}">
      <div class="impact-value" data-countup="${realizados.length}">0</div>
      <div class="impact-label">${esc(t.label)}</div>
      <div class="impact-split-bar">${bar}</div>
      <div class="impact-split-legend">${legend}</div>
      ${estadoBits? `<div class="impact-split-legend" style="margin-top:3px">${estadoBits}</div>` : ''}
      <div class="clickable-hint">👆 Ver el detalle (incluye evaluación)</div>
    </div>`;
  }).join("");
  return `<div class="impact-grid">${cards}</div>`;
}

// Colores fijos de Categoría de gestión (mismo criterio en toda la app: nunca barras para
// esta composición de 4 valores -> se usan chips con punto de color + conteo).
const CATEGORIA_COLORS = {
  'Estratégico':'var(--ic-purple)', 'Administrativo':'var(--ic-dark-grey)',
  'Recurrente':'var(--series-1)', 'Contingente':'var(--ic-electric-yellow)'
};
function categoriaChipsRow(porCat){
  if(!porCat.length) return '<p style="color:var(--text-muted); font-size:12px">Sin categoría registrada.</p>';
  return `<div class="cat-chip-row">${porCat.map(c=>`<span class="cat-chip">
    <span class="cat-chip-dot" style="background:${CATEGORIA_COLORS[c.label]||'var(--text-muted)'}"></span>
    ${esc(c.label)} <strong>${fmt(c.value)}</strong>
  </span>`).join("")}</div>`;
}
// Anillo/donut para "Por categoría de gestión" (4 categorías fijas, el total al centro) —
// la usuaria eligió esta forma entre 3 alternativas (barra segmentada / línea / anillo) tras
// no quedar conforme con barras ni chips.
function categoriaDonut(porCat){
  if(!porCat.length) return '<p style="color:var(--text-muted); font-size:12px">Sin categoría registrada.</p>';
  const total = porCat.reduce((s,c)=>s+c.value,0) || 1;
  const r = 50, cx = 62, cy = 62, c = 2*Math.PI*r;
  let acc = 0;
  const segments = porCat.map(it=>{
    const dash = (it.value/total)*c;
    const seg = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${CATEGORIA_COLORS[it.label]||'var(--text-muted)'}" stroke-width="18"
      stroke-dasharray="${dash.toFixed(2)} ${(c-dash).toFixed(2)}" stroke-dashoffset="${(-acc).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"/>`;
    acc += dash;
    return seg;
  }).join("");
  const legend = porCat.map(it=>`<div class="donut-legend-item">
    <span class="donut-legend-dot" style="background:${CATEGORIA_COLORS[it.label]||'var(--text-muted)'}"></span>
    ${esc(it.label)} <strong>${fmt(it.value)}</strong>
  </div>`).join("");
  return `<div class="donut-wrap">
    <svg width="124" height="124" viewBox="0 0 124 124">
      ${segments}
      <text x="${cx}" y="${cy+6}" text-anchor="middle" font-size="19" font-weight="800" fill="var(--text-primary)">${fmt(total)}</text>
    </svg>
    <div class="donut-legend">${legend}</div>
  </div>`;
}

// Ranking de áreas con flecha para abrir, por fila, el desglose por Categoría de gestión
// (Estratégico/Administrativo/Recurrente/Contingente) de esa área específica. El desglose va
// como chips (no otra barra horizontal más — ya hay varias en la página).
// `visibleCount`: cuántas filas se ven de entrada (el resto queda detrás de un botón "Ver
// todas las áreas") -> se sigue mostrando el top acotado por defecto, pero sin perder acceso
// al resto sin tener que ir a otra página.
function areaRankingExpandable(items, allActions, visibleCount){
  visibleCount = visibleCount || items.length;
  const max = Math.max(...items.map(i=>i.value), 1);
  const rowHtml = items.map((it,idx)=>{
    const widthPct = Math.max((it.value/max)*100, 2);
    const color = `var(${SEQ_STEPS[Math.min(idx,SEQ_STEPS.length-1)]})`;
    const porCat = groupCount(allActions.filter(a=>a.direccion===it.label), a=>a.categoria).filter(c=>c.label!=='Sin especificar');
    return `<div class="area-rank-item">
      <button type="button" class="area-rank-row" data-idx="${idx}" aria-expanded="false">
        <span class="area-rank-chevron">▸</span>
        <span class="b-label">${esc(it.label)}</span>
        <span class="b-track"><span class="b-fill" style="width:${widthPct}%; background:${color}"></span></span>
        <span class="b-value">${fmt(it.value)}</span>
      </button>
      <div class="area-rank-detail" id="area-rank-detail-${idx}" hidden>
        <div class="card-sub" style="margin:6px 0 6px">Por categoría de gestión en ${esc(it.label)}</div>
        ${categoriaChipsRow(porCat)}
      </div>
    </div>`;
  });
  const visible = rowHtml.slice(0, visibleCount).join("");
  const resto = rowHtml.slice(visibleCount).join("");
  const hasMore = items.length > visibleCount;
  return `<div class="area-rank">${visible}</div>
    ${hasMore? `<div class="area-rank" id="area-rank-extra" hidden>${resto}</div>
    <button type="button" class="area-rank-more" id="area-rank-more-btn" aria-expanded="false">
      <span class="area-rank-chevron">▸</span> Ver las ${fmt(items.length - visibleCount)} áreas restantes (${fmt(items.length)} en total)
    </button>` : ''}`;
}
function wireAreaRanking(){
  document.querySelectorAll('.area-rank-row').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const detail = document.getElementById('area-rank-detail-'+btn.dataset.idx);
      const expanded = btn.getAttribute('aria-expanded')==='true';
      btn.setAttribute('aria-expanded', expanded? 'false':'true');
      if(detail) detail.hidden = expanded;
    });
  });
  const moreBtn = document.getElementById('area-rank-more-btn');
  if(moreBtn) moreBtn.addEventListener('click', ()=>{
    const extra = document.getElementById('area-rank-extra');
    const expanded = moreBtn.getAttribute('aria-expanded')==='true';
    moreBtn.setAttribute('aria-expanded', expanded? 'false':'true');
    if(extra) extra.hidden = expanded;
  });
}

/* ---------------------------------------------------------------------------
   8. TABLA DE DETALLE (buscar / ordenar / paginar)
--------------------------------------------------------------------------- */
function renderActionsTable(actions, scope){
  const ts = STATE.tableState;
  let rows = actions;
  if(ts.search){
    const q = stripAccents(ts.search.toLowerCase());
    rows = rows.filter(a => stripAccents(JSON.stringify(a).toLowerCase()).includes(q));
  }
  rows = [...rows].sort((a,b)=>{
    let av = a[ts.sortKey], bv = b[ts.sortKey];
    if(ts.sortKey==='fecha'){ av = av||''; bv = bv||''; }
    if(av==null) av=''; if(bv==null) bv='';
    const cmp = av.toString().localeCompare(bv.toString(), 'es', {numeric:true});
    return ts.sortDir==='asc'? cmp : -cmp;
  });
  const totalPages = Math.max(1, Math.ceil(rows.length/ts.pageSize));
  ts.page = Math.min(ts.page, totalPages);
  const pageRows = rows.slice((ts.page-1)*ts.pageSize, ts.page*ts.pageSize);
  const cols = [
    {key:'mes', label:'Mes'}, {key:'accion', label:'Tipo'}, {key:'direccion', label:'Área solicitante'}, {key:'categoria', label:'Categoría'},
    {key:'descripcion', label:'Descripción'}, {key:'statusLabel', label:'Estado'}, {key:'fecha', label:'Fecha ejecución'}
  ];
  return `
    <div class="table-toolbar">
      <input class="search-box" id="table-search-${scope}" placeholder="Buscar en todas las columnas…" value="${esc(ts.search)}">
      <span style="color:var(--text-muted); font-size:12.5px">${fmt(rows.length)} resultados</span>
    </div>
    <div class="table-scroll">
      <table class="data-table">
        <thead><tr>${cols.map(c=>`<th data-key="${c.key}" data-scope="${scope}">${c.label} ${ts.sortKey===c.key? (ts.sortDir==='asc'?'▲':'▼'):''}</th>`).join("")}</tr></thead>
        <tbody>${pageRows.map(a=>`<tr>
          <td>${esc(a.mes||'—')}</td>
          <td>${esc(a.accion)}</td>
          <td>${esc(a.direccion)}</td>
          <td>${esc(a.categoria)}</td>
          <td>${esc(a.descripcion||'—')}</td>
          <td>${statusBadge(a)}</td>
          <td>${esc(a.fecha||'—')}</td>
        </tr>`).join("")}</tbody>
      </table>
    </div>
    <div class="pagination">
      <button data-scope="${scope}" class="pg-prev" ${ts.page<=1?'disabled':''}>← Anterior</button>
      <span>Página ${ts.page} de ${totalPages}</span>
      <button data-scope="${scope}" class="pg-next" ${ts.page>=totalPages?'disabled':''}>Siguiente →</button>
    </div>
  `;
}
function wireActionsTable(scope){
  const root = document.getElementById("page-root");
  const search = root.querySelector(`#table-search-${scope}`);
  if(search) search.addEventListener('input', e=>{ STATE.tableState.search = e.target.value; STATE.tableState.page=1; render(); preserveFocus(`#table-search-${scope}`); });
  root.querySelectorAll('th[data-key]').forEach(th=>{
    th.addEventListener('click', ()=>{
      const key = th.dataset.key;
      if(STATE.tableState.sortKey===key) STATE.tableState.sortDir = STATE.tableState.sortDir==='asc'?'desc':'asc';
      else { STATE.tableState.sortKey = key; STATE.tableState.sortDir='asc'; }
      render();
    });
  });
  const prev = root.querySelector('.pg-prev'); if(prev) prev.addEventListener('click', ()=>{ STATE.tableState.page--; render(); });
  const next = root.querySelector('.pg-next'); if(next) next.addEventListener('click', ()=>{ STATE.tableState.page++; render(); });
}
function preserveFocus(sel){
  const el = document.querySelector(sel);
  if(el){ el.focus(); const v=el.value; el.value=''; el.value=v; }
}

/* ---------------------------------------------------------------------------
   9. NAV / ROUTER
--------------------------------------------------------------------------- */
function renderNav(){
  let activeId = (location.hash||'#overview').slice(1);
  if(!PAGES.find(p=>p.id===activeId)) activeId = 'overview';
  const groups = [...new Set(PAGES.map(p=>p.group))];
  document.getElementById('sidebar-nav').innerHTML = groups.map(g=>`
    <div class="nav-group-label">${g}</div>
    ${PAGES.filter(p=>p.group===g).map(p=>`
      <button class="nav-link ${p.id===activeId?'active':''}" data-id="${p.id}"><span class="dot"></span>${p.label}</button>
    `).join("")}
  `).join("");
  document.querySelectorAll('.nav-link').forEach(btn=>{
    btn.addEventListener('click', ()=>{ location.hash = '#'+btn.dataset.id; });
  });
  return activeId;
}

function render(){
  const activeId = renderNav();
  const page = PAGES.find(p=>p.id===activeId) || PAGES[0];
  page.render();
}

window.addEventListener('hashchange', render);

/* ---------------------------------------------------------------------------
   10. ACTUALIZACIÓN DE DATOS (subir Excel nuevo, en el navegador)
--------------------------------------------------------------------------- */
function parseUploadedWorkbook(workbook){
  const sheetNames = workbook.SheetNames;
  const findSheet = (needle) => sheetNames.find(n => stripAccents(n.toLowerCase()).includes(needle));

  // Tareas (2) - tabla con cabecera no siempre en la fila 1 (en el Excel real vive más abajo,
  // bajo un cuadro de cumpleaños) -> se busca la fila de encabezados por contenido, no por
  // posición fija, y las columnas por nombre (igual que Mapping Completo más abajo).
  // Si existen varias pestañas "Tareas", se prefiere la que trae "Área solicitante"/"Categoría"
  // (la clasificación nueva) sobre una versión vieja sin esas columnas.
  let internal = [];
  const tareasCandidates = sheetNames.filter(n => stripAccents(n.toLowerCase()).includes("tareas"));
  let tareasName = tareasCandidates.find(n => /\(2\)/.test(n)) || tareasCandidates[0];
  if(tareasName){
    const ws = workbook.Sheets[tareasName];
    const rows2d = XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:""});
    const headerRowIdx = rows2d.findIndex(r => r.some(c => stripAccents((c||"").toString().toLowerCase()).includes("accion")));
    if(headerRowIdx>=0){
      const header = rows2d[headerRowIdx].map(h => stripAccents((h||"").toString().toLowerCase()));
      const col = (needle) => header.findIndex(h => h.includes(needle));
      const idx = {
        anio: col("ano"), mes: col("mes"), accion: col("accion"),
        areaSolicitante: col("area solicitante"), categoria: col("categor"),
        descripcion: col("descripcion"), status: col("status"), fecha: col("fecha de ejecucion")
      };
      const g = (r,key) => idx[key]>=0 ? (r[idx[key]]||"") : "";
      for(let i=headerRowIdx+1;i<rows2d.length;i++){
        const r = rows2d[i];
        if(!r || !g(r,'descripcion').toString().trim()) continue;
        internal.push({
          anio:g(r,'anio'), mes:g(r,'mes'), accion:g(r,'accion'),
          areaSolicitante:g(r,'areaSolicitante'), categoria:g(r,'categoria'),
          descripcion:g(r,'descripcion'), status:g(r,'status'), fecha:g(r,'fecha')
        });
      }
    }
  }

  // MAPPING COMPLETO - Open Coffee / Townhall / Evento / Pit Stop, con evaluación por instancia.
  // OJO: en los datos embebidos, "Cancelado" se detecta por color de celda (leído directamente
  // con Excel COM, ver Ronda 23 en memoria) Y por el texto "CANCELADO" en Comentarios/Participantes.
  // La librería SheetJS community que corre en el navegador no expone formato/color de celda,
  // así que un Excel subido acá con el botón "Actualizar datos" solo puede detectar cancelados
  // por el texto "CANCELADO" en Comentarios/Participantes, no por color.
  let eventos = [];
  const mappingName = findSheet("mapping completo") || findSheet("mapping");
  if(mappingName){
    const ws = workbook.Sheets[mappingName];
    const rows2d = XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:""});
    const header = (rows2d[0]||[]).map(h => stripAccents((h||"").toString().toLowerCase()));
    const col = (needle) => header.findIndex(h => h.includes(needle));
    const idx = {
      categoria: col("categor"), mes: col("mes"), fecha: col("fecha"), nombre: col("nombre"),
      cluster: col("cluster"), mercado: col("mercado"), direccion: col("direcci"),
      publico: col("publico"), quieninvita: col("quien invita"), participantes: col("participantes"),
      ubicacion: col("ubicaci"), evaluacion: col("evaluaci"), comentarios: col("comentario")
    };
    for(let i=1;i<rows2d.length;i++){
      const r = rows2d[i];
      const cat = idx.categoria>=0? (r[idx.categoria]||"").toString().trim() : "";
      if(!cat) continue;
      const g = (key) => idx[key]>=0 ? (r[idx[key]]||"") : "";
      const comentarios = g('comentarios'), participantes = g('participantes');
      const cancelado = /cancelad/i.test(comentarios.toString()) || /cancelad/i.test(participantes.toString());
      eventos.push({
        categoria: cat, mes: g('mes'), fecha: g('fecha'), nombre: g('nombre'), cluster: g('cluster'),
        mercado: g('mercado'), direccion: g('direccion'), publico: g('publico'), quieninvita: g('quieninvita'),
        participantes: participantes, ubicacion: g('ubicacion'), evaluacion: g('evaluacion'), comentarios: comentarios,
        cancelado: cancelado
      });
    }
  }

  // AGENCIA EK - bloques narrativos por mes
  let ek = [];
  const ekName = findSheet("agencia ek") || findSheet(" ek");
  if(ekName){
    const ws = workbook.Sheets[ekName];
    const rows2d = XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:""});
    let current = null;
    for(const r of rows2d){
      const cell = (r[0]||"").toString().trim();
      if(!cell) continue;
      const bare = cell.replace(/:$/,"");
      const monthMatch = MESES_ORDEN.find(m=>stripAccents(m.toUpperCase())===stripAccents(bare.toUpperCase()));
      if(monthMatch){
        if(current) ek.push(current);
        current = {mes: monthMatch.toUpperCase(), items:[]};
      } else if(current && !/reporte de gestiones/i.test(cell)){
        current.items.push(cell.replace(/^[●•\-\s]+/,""));
      }
    }
    if(current) ek.push(current);
  }

  // AGENCIA ENGAGE - tabla resumen de "Tipo de Solicitudes"
  let engage = STATE.agenciaEngage;
  const engageName = findSheet("engage");
  if(engageName){
    const ws = workbook.Sheets[engageName];
    const rows2d = XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:""});
    const num = v => parseFloat((v||"0").toString().replace(/[^\d.-]/g,"")) || 0;
    const findRow = (label) => rows2d.find(r => (r[0]||"").toString().trim().toLowerCase() === label);
    const est = findRow("total solicitudes estratégicas") || findRow("total solicitudes estrategicas");
    const mail = findRow("total solicitudes mailings y piezas");
    const tot = findRow("total piezas") || findRow("total piezas");
    const desgloseStart = rows2d.findIndex(r => (r[0]||"").toString().trim().toLowerCase()==="tipo de solicitudes" );
    const desglose = [];
    if(desgloseStart>=0){
      for(let i=desgloseStart+1;i<rows2d.length;i++){
        const r = rows2d[i];
        if(!r || !r[0] || !r[0].toString().trim()) break;
        desglose.push({tipo:r[0], n:num(r[1]), piezas:num(r[2]), notes:r[3]||""});
      }
    }
    if(est || mail || tot){
      engage = {
        resumen: {
          estrategicas: est? {n:num(est[1]), piezas:num(est[2]), notes:est[3]||""} : STATE.agenciaEngage.resumen.estrategicas,
          mailingsPiezas: mail? {n:num(mail[1]), piezas:num(mail[2]), notes:mail[3]||""} : STATE.agenciaEngage.resumen.mailingsPiezas,
          totalPiezas: tot? {n:num(tot[1]), piezas:num(tot[2])} : STATE.agenciaEngage.resumen.totalPiezas
        },
        desglose: desglose.length? desglose : STATE.agenciaEngage.desglose
      };
    }
  }

  // AGENCIA EFIMERO - bloques narrativos por mes, con categoría por ítem (misma estructura
  // de "mes en blanco + filas Categoría|Ítem" que EK, pero con una columna extra)
  let efimero = [];
  const efName = findSheet("efimero");
  if(efName){
    const ws = workbook.Sheets[efName];
    const rows2d = XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:""});
    let currentEf = null;
    for(const r of rows2d){
      const a = (r[0]||"").toString().trim();
      const b = (r[1]||"").toString().trim();
      const monthMatch = MESES_ORDEN.find(m=>stripAccents(m.toUpperCase())===stripAccents(b.toUpperCase()));
      if(!a && monthMatch){
        if(currentEf) efimero.push(currentEf);
        currentEf = {mes: monthMatch.toUpperCase(), items:[]};
      } else if(a.toLowerCase()==='categoria' && monthMatch){
        if(currentEf) efimero.push(currentEf);
        currentEf = {mes: monthMatch.toUpperCase(), items:[]};
      } else if(a){
        if(!currentEf) currentEf = {mes:"ENERO", items:[]};
        currentEf.items.push({categoria:a, item:b});
      }
    }
    if(currentEf) efimero.push(currentEf);
  }
  const efimeroPendiente = !efimero.length;

  return {
    internal: internal.length? internal : RAW_INTERNAL_ACTIONS,
    ek: ek.length? ek : RAW_EK_REPORT,
    efimero: efimero.length? efimero : RAW_AGENCIA_EFIMERO,
    eventos: eventos.length? eventos : RAW_EVENTOS_MAPPING,
    gi: STATE.gestionInterna,
    engage,
    efimeroPendiente,
    meta: { fileName: "(subido por el usuario)", loadedAt: new Date().toISOString().slice(0,10), sheets: sheetNames }
  };
}

function showToast(msg){
  const t = document.createElement('div');
  t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 4200);
}

function wireUpload(){
  const input = document.getElementById('file-input');
  document.getElementById('btn-upload').addEventListener('click', ()=> input.click());
  input.addEventListener('change', e=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev=>{
      try{
        const wb = XLSX.read(new Uint8Array(ev.target.result), {type:"array"});
        const parsed = parseUploadedWorkbook(wb);
        localStorage.setItem("comms_dashboard_data", JSON.stringify(parsed));
        loadData();
        document.getElementById('btn-reset').style.display='block';
        STATE.tableState.page=1;
        render();
        showToast("✓ Datos actualizados desde "+file.name);
      }catch(err){
        console.error(err);
        showToast("No se pudo leer el archivo. Verifica que mantenga los nombres de pestaña originales.");
      }
    };
    reader.readAsArrayBuffer(file);
    input.value = "";
  });
  document.getElementById('btn-reset').addEventListener('click', ()=>{
    localStorage.removeItem("comms_dashboard_data");
    loadData();
    document.getElementById('btn-reset').style.display='none';
    render();
    showToast("Se restauraron los datos originales del Excel.");
  });
}

render();
