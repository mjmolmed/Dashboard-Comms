<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comunicaciones Cono Sur · Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  /* Paleta oficial Inchcape Brand Guidelines v1.0 (pág. 22): Dark Blue, Eco Blue, Electric Yellow + secundarios */
  --ic-dark-blue:#001a41; --ic-eco-blue:#18bde6; --ic-electric-yellow:#f2e400;
  --ic-green:#b6cd00; --ic-purple:#9e61a4; --ic-dark-grey:#394650; --ic-mid-grey:#848a8c;

  --surface-1:#fcfcfb; --page-plane:#f4f4f1; --surface-sidebar:var(--ic-dark-blue);
  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#898781;
  --grid-line:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,0.10);
  --series-1:var(--ic-eco-blue); --series-2:var(--ic-purple); --series-3:var(--ic-green); --series-4:var(--ic-electric-yellow);
  --series-5:#e87ba4; --series-6:var(--ic-dark-grey); --series-7:#4a3aa7; --series-8:#e34948;
  --status-good:#0ca30c; --status-warning:#fab219; --status-serious:#ec835a; --status-critical:#d03b3b;
  /* Rampa secuencial propia: de Inchcape Dark Blue (rango 1) a Eco Blue claro (cola del ranking) */
  --seq-100:#d6f1fa; --seq-150:#bfe9f7; --seq-200:#a3e0f5; --seq-250:#86d6f1; --seq-300:#63c8ec;
  --seq-350:#18bde6; --seq-400:#13a0c5; --seq-450:#0f82a3; --seq-500:#0c6482; --seq-550:#094a60;
  --seq-600:#06324a; --seq-650:#031f30; --seq-700:#001a41;
  --success-text:#006300;
  --radius:10px;
  --sidebar-w:252px;
  --font-brand:"Century Gothic","Avant Garde Gothic Pro","Jost","Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;}
body{background:var(--page-plane); color:var(--text-primary); font:14px/1.5 var(--font-brand);}
h1,h2,h3,h4{margin:0; font-weight:600;}
button{font-family:inherit;}
.app{display:flex; min-height:100vh;}

/* ---------- SIDEBAR ---------- */
.sidebar{
  width:var(--sidebar-w); flex:0 0 var(--sidebar-w); background:var(--surface-sidebar); color:#fff;
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.sidebar-brand{padding:22px 20px 16px; border-bottom:1px solid rgba(255,255,255,0.08);}
.sidebar-brand .brand-logo{height:26px; width:auto; display:block; margin-bottom:16px;}
.sidebar-brand .eyebrow{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ic-eco-blue); margin-bottom:4px; font-weight:600;}
.sidebar-brand .title{font-size:17px; font-weight:700; color:#fff; line-height:1.25;}
.sidebar-nav{padding:14px 10px; flex:1;}
.nav-group-label{font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:#6c7b98; padding:12px 10px 6px;}
.nav-link{
  display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; color:#c9d2e3;
  text-decoration:none; font-size:13.5px; margin-bottom:2px; cursor:pointer; border:none; background:none; width:100%; text-align:left;
}
.nav-link:hover{background:rgba(255,255,255,0.06); color:#fff;}
.nav-link.active{background:var(--series-1); color:var(--ic-dark-blue); font-weight:700;}
.nav-link .dot{width:7px; height:7px; border-radius:50%; background:currentColor; opacity:.55; flex:0 0 auto;}
.nav-link.active .dot{opacity:1;}
.sidebar-foot{padding:14px 16px 18px; border-top:1px solid rgba(255,255,255,0.08); font-size:11.5px; color:#8696b5;}
.sidebar-foot button{
  width:100%; background:rgba(255,255,255,0.08); color:#fff; border:1px solid rgba(255,255,255,0.14);
  border-radius:8px; padding:8px 10px; font-size:12px; cursor:pointer; margin-top:8px; text-align:left;
}
.sidebar-foot button:hover{background:rgba(255,255,255,0.16);}
#file-input{display:none;}

/* ---------- MAIN ---------- */
.main{flex:1; min-width:0; padding:26px 32px 60px;}
.page-header{margin-bottom:18px;}
.page-header .eyebrow{font-size:11.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-muted); font-weight:600;}
.page-header h1{font-size:25px; margin-top:4px;}
.page-header p{color:var(--text-secondary); margin-top:6px; max-width:760px;}

/* ---------- FILTER BAR ---------- */
.filter-bar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; background:var(--surface-1); border:1px solid var(--border); border-radius:var(--radius); padding:10px 12px; margin-bottom:20px;}
.filter-bar .flabel{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); margin-right:2px;}
details.fchip{position:relative;}
details.fchip summary{
  list-style:none; cursor:pointer; padding:6px 10px; border:1px solid var(--border); border-radius:7px;
  font-size:12.5px; color:var(--text-primary); background:#fff; display:flex; align-items:center; gap:6px;
}
details.fchip summary::-webkit-details-marker{display:none;}
details.fchip summary .count{background:var(--series-1); color:var(--ic-dark-blue); border-radius:999px; font-size:10.5px; padding:1px 6px; font-weight:700;}
details.fchip[open] summary{border-color:var(--series-1);}
.fpanel{
  position:absolute; top:calc(100% + 4px); left:0; background:#fff; border:1px solid var(--border); border-radius:9px;
  box-shadow:0 8px 24px rgba(0,0,0,0.12); padding:8px; min-width:220px; max-height:280px; overflow-y:auto; z-index:40;
}
.fpanel label{display:flex; align-items:center; gap:7px; padding:5px 6px; font-size:12.5px; border-radius:5px; cursor:pointer;}
.fpanel label:hover{background:var(--page-plane);}
.fpanel input[type=checkbox]{accent-color:var(--series-1);}
.btn-clear{padding:6px 12px; border-radius:7px; border:1px solid var(--border); background:#fff; font-size:12.5px; color:var(--text-secondary); cursor:pointer;}
.btn-clear:hover{border-color:var(--status-critical); color:var(--status-critical);}
.search-box{padding:6px 10px; border:1px solid var(--border); border-radius:7px; font-size:12.5px; min-width:190px; background:#fff;}
.filter-result-count{margin-left:auto; font-size:12px; color:var(--text-muted);}

/* ---------- HERO BANNER ---------- */
.hero-banner{
  position:relative; overflow:hidden; border-radius:16px;
  background:linear-gradient(135deg,var(--ic-dark-blue) 0%,#0a2d5c 55%,#0c3a73 100%);
  padding:38px 42px; margin-bottom:22px; color:#fff;
  display:flex; align-items:center; gap:40px; flex-wrap:wrap;
  box-shadow:0 14px 34px -14px rgba(0,26,65,0.45);
}
.hero-decoration{position:absolute; right:-50px; top:-60px; width:460px; height:auto; opacity:.6; pointer-events:none; mix-blend-mode:screen;}
.hero-main{position:relative; z-index:1;}
.hero-eyebrow{font-size:12px; letter-spacing:.09em; text-transform:uppercase; color:var(--ic-eco-blue); font-weight:700; margin-bottom:8px;}
.hero-figure{font-size:92px; font-weight:800; line-height:1; letter-spacing:-0.02em; font-variant-numeric:proportional-nums;}
.hero-figure-label{font-size:14px; color:#c7d6ef; margin-top:10px; max-width:280px; line-height:1.4;}
.hero-stats{display:flex; gap:30px; flex-wrap:wrap; position:relative; z-index:1; border-left:1px solid rgba(255,255,255,0.2); padding-left:34px;}
.hero-stat{min-width:92px;}
.hero-stat .hs-value{font-size:36px; font-weight:700; line-height:1; font-variant-numeric:proportional-nums;}
.hero-stat .hs-label{font-size:11.5px; color:#aebde0; margin-top:6px; max-width:130px; line-height:1.35;}
@media (max-width:980px){
  .hero-figure{font-size:64px;}
  .hero-stats{border-left:none; padding-left:0; border-top:1px solid rgba(255,255,255,0.2); padding-top:18px; width:100%;}
}

/* ---------- KPI ---------- */
.kpi-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(165px,1fr)); gap:12px; margin-bottom:22px;}
.kpi-card{background:var(--surface-1); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px;}
.kpi-card .kpi-value{font-size:30px; font-weight:700; letter-spacing:-0.01em; color:var(--text-primary); line-height:1.1;}
.kpi-card.accent{background:linear-gradient(145deg,var(--ic-dark-blue),#0c3a73); border-color:transparent;}
.kpi-card.accent .kpi-value{color:#fff;}
.kpi-card.accent .kpi-label{color:#aebde0;}
.kpi-card .kpi-label{font-size:12px; color:var(--text-secondary); margin-top:6px;}
.kpi-card .kpi-sub{font-size:11px; color:var(--text-muted); margin-top:2px;}

/* ---------- CARDS / SECTIONS ---------- */
.section-title{font-size:16px; font-weight:700; margin:28px 0 4px;}
.section-sub{font-size:12.5px; color:var(--text-secondary); margin-bottom:14px; max-width:720px;}
.grid-2{display:grid; grid-template-columns:1.3fr 1fr; gap:14px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
@media (max-width:1150px){.grid-2,.grid-3{grid-template-columns:1fr;}}
.card{background:var(--surface-1); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px;}
.card-title{font-size:13.5px; font-weight:700; margin-bottom:8px;}
.card-sub{font-size:11.5px; color:var(--text-muted); margin-top:-4px; margin-bottom:14px;}
.card-note{font-size:11px; color:var(--text-muted); margin-top:10px; border-top:1px dashed var(--grid-line); padding-top:8px;}

/* ---------- BAR CHART (horizontal ranking) ---------- */
.bar-row{display:grid; grid-template-columns:150px 1fr 56px; gap:10px; align-items:center; margin-bottom:7px; position:relative;}
.b-label{font-size:12px; color:var(--text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.b-track{height:20px; background:var(--grid-line); border-radius:4px; position:relative; overflow:hidden;}
.b-fill{height:100%; border-radius:4px 4px 4px 4px; transition:width .25s ease;}
.b-value{font-size:12px; color:var(--text-secondary); text-align:right; font-variant-numeric:tabular-nums;}
.bar-row:hover .b-track{outline:2px solid var(--series-1); outline-offset:1px;}

/* ---------- AREA RANKING (expandible por categoría) ---------- */
.area-rank{display:flex; flex-direction:column; gap:1px;}
.area-rank[hidden]{display:none;}
.area-rank-row{display:grid; grid-template-columns:16px 150px 1fr 56px; gap:10px; align-items:center; width:100%; background:none; border:none; padding:6px 4px; cursor:pointer; text-align:left; border-radius:6px; font:inherit;}
.area-rank-row:hover{background:var(--page-plane);}
.area-rank-chevron{display:inline-block; transition:transform .15s; color:var(--text-muted); font-size:11px;}
.area-rank-row[aria-expanded="true"] .area-rank-chevron{transform:rotate(90deg); color:var(--series-1);}
.area-rank-row .b-label{font-size:12px; color:var(--text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.area-rank-row .b-track{display:block; height:20px; background:var(--grid-line); border-radius:4px; overflow:hidden;}
.area-rank-row .b-fill{display:block; height:100%; border-radius:4px;}
.area-rank-row .b-value{font-size:12px; color:var(--text-secondary); text-align:right; font-variant-numeric:tabular-nums;}
.area-rank-detail{padding:2px 4px 14px 42px; border-bottom:1px dashed var(--grid-line); margin-bottom:3px;}
.area-rank-detail[hidden]{display:none;}
.area-rank-more{display:flex; align-items:center; gap:6px; width:100%; background:none; border:none; border-top:1px dashed var(--grid-line); padding:10px 4px 2px; margin-top:4px; cursor:pointer; font-size:12px; color:var(--series-1); font-weight:600; text-align:left; font-family:inherit;}
.area-rank-more:hover{color:var(--ic-dark-blue);}
.area-rank-more[aria-expanded="true"] .area-rank-chevron{transform:rotate(90deg); color:var(--series-1);}

/* ---------- CATEGORÍA DE GESTIÓN (chips, no barra) ---------- */
.cat-chip-row{display:flex; flex-wrap:wrap; gap:8px;}
.cat-chip{display:inline-flex; align-items:center; gap:7px; font-size:12px; color:var(--text-secondary); background:var(--page-plane); border:1px solid var(--border); border-radius:999px; padding:6px 13px;}
.cat-chip-dot{width:8px; height:8px; border-radius:50%; flex:0 0 auto;}
.cat-chip strong{color:var(--text-primary); font-weight:700;}
.donut-wrap{display:flex; align-items:center; gap:26px; flex-wrap:wrap;}
.donut-legend{display:flex; flex-direction:column; gap:9px;}
.donut-legend-item{font-size:12.5px; color:var(--text-secondary); display:flex; align-items:center; gap:9px;}
.donut-legend-dot{width:10px; height:10px; border-radius:50%; flex:0 0 auto;}
.donut-legend-item strong{color:var(--text-primary); font-weight:700; margin-left:4px;}

/* ---------- EVENT IMPACT CARDS ---------- */
.impact-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin-bottom:10px;}
.impact-card{background:var(--surface-1); border:1px solid var(--border); border-top:3px solid var(--ic-eco-blue); border-radius:var(--radius); padding:20px 20px 16px;}
.impact-card.clickable{cursor:pointer; transition:box-shadow .15s, transform .15s;}
.impact-card.clickable:hover{box-shadow:0 8px 20px -6px rgba(0,26,65,0.25); transform:translateY(-2px);}
.impact-value{font-size:44px; font-weight:800; line-height:1; color:var(--ic-dark-blue); letter-spacing:-0.01em; font-variant-numeric:proportional-nums;}
.impact-label{font-size:13.5px; font-weight:700; color:var(--text-primary); margin-top:6px;}
.impact-split-bar{display:flex; height:7px; border-radius:4px; overflow:hidden; margin-top:14px; background:var(--grid-line);}
.impact-split-legend{font-size:11px; color:var(--text-muted); margin-top:6px;}
.impact-eval{font-size:12px; font-weight:700; color:var(--ic-dark-blue); margin-top:10px; padding-top:9px; border-top:1px dashed var(--grid-line);}

/* ---------- LINE CHART ---------- */
.linechart-wrap{width:100%; overflow-x:auto;}
.line-tooltip{position:absolute; background:#17233c; color:#fff; font-size:11.5px; padding:6px 9px; border-radius:6px; pointer-events:none; opacity:0; transition:opacity .1s; white-space:nowrap; z-index:50;}

/* ---------- STATUS BADGE ---------- */
.badge{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:3px 9px; border-radius:999px; white-space:nowrap;}
.badge .bd{width:7px; height:7px; border-radius:50%;}

/* ---------- TABLE ---------- */
.table-toolbar{display:flex; gap:8px; align-items:center; margin-bottom:10px; flex-wrap:wrap;}
.table-scroll{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); background:#fff;}
table.data-table{width:100%; border-collapse:collapse; font-size:12.5px; min-width:760px;}
table.data-table th{
  text-align:left; padding:10px 12px; background:#f6f6f4; border-bottom:1px solid var(--border); color:var(--text-secondary);
  font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; cursor:pointer; white-space:nowrap; user-select:none;
}
table.data-table th:hover{color:var(--series-1);}
table.data-table td{padding:9px 12px; border-bottom:1px solid var(--grid-line); vertical-align:top;}
table.data-table tr:hover td{background:#fafaf8;}
.pagination{display:flex; align-items:center; gap:10px; margin-top:12px; font-size:12.5px; color:var(--text-secondary);}
.pagination button{padding:5px 10px; border:1px solid var(--border); background:#fff; border-radius:6px; cursor:pointer;}
.pagination button:disabled{opacity:.4; cursor:default;}

/* ---------- AGENCY CARDS ---------- */
.agency-card{background:var(--surface-1); border:1px solid var(--border); border-radius:12px; padding:20px; display:flex; flex-direction:column; gap:10px;}
.agency-card .ag-name{font-size:16px; font-weight:700;}
.agency-card .ag-badge{font-size:11px; padding:3px 9px; border-radius:999px; font-weight:600; width:fit-content;}
.agency-card .ag-metric{display:flex; justify-content:space-between; font-size:12.5px; padding:5px 0; border-bottom:1px dashed var(--grid-line);}
.agency-card a.ag-link{margin-top:6px; font-size:12.5px; color:var(--series-1); font-weight:600; text-decoration:none;}
.agency-card a.ag-link:hover{text-decoration:underline;}

/* ---------- EMPTY STATE ---------- */
.empty-state{background:var(--surface-1); border:1.5px dashed var(--baseline); border-radius:12px; padding:48px 30px; text-align:center;}
.empty-state .es-icon{font-size:34px; margin-bottom:10px;}
.empty-state h3{font-size:17px; margin-bottom:8px;}
.empty-state p{color:var(--text-secondary); max-width:440px; margin:0 auto;}
.empty-state .es-badge{display:inline-block; margin-top:14px; padding:5px 14px; border-radius:999px; background:#fdf1dc; color:#8a5a00; font-size:12px; font-weight:700;}

/* ---------- EK TIMELINE ---------- */
.ek-month{margin-bottom:18px;}
.ek-month-head{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
.ek-month-head h4{font-size:13.5px;}
.ek-month-head .ek-count{font-size:11px; background:var(--series-1); color:var(--ic-dark-blue); padding:2px 9px; border-radius:999px; font-weight:700;}
.ek-items{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px;}
.ek-items li{font-size:12.5px; color:var(--text-primary); padding:9px 12px; background:#fff; border:1px solid var(--border); border-radius:7px; line-height:1.45;}

/* ---------- MODAL (detalle al pinchar una tarjeta/barra de eventos) ---------- */
.modal-backdrop{position:fixed; inset:0; background:rgba(11,11,11,0.55); display:flex; align-items:center; justify-content:center; z-index:200; padding:20px;}
.modal-backdrop[hidden]{display:none;}
.modal-box{background:#fff; border-radius:14px; max-width:760px; width:100%; max-height:82vh; display:flex; flex-direction:column; box-shadow:0 24px 60px rgba(0,0,0,0.32);}
.modal-head{display:flex; align-items:flex-start; justify-content:space-between; gap:14px; padding:18px 22px; border-bottom:1px solid var(--border);}
.modal-head h3{font-size:16px;}
.modal-head p{font-size:12px; color:var(--text-secondary); margin-top:4px;}
.modal-close{background:none; border:none; font-size:16px; cursor:pointer; color:var(--text-muted); padding:5px 9px; border-radius:7px; flex:0 0 auto;}
.modal-close:hover{background:var(--page-plane); color:var(--text-primary);}
.modal-body{padding:16px 22px 22px; overflow-y:auto;}
.clickable-hint{display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700; color:var(--ic-dark-blue); background:#e3f6fc; border:1px solid var(--ic-eco-blue); border-radius:999px; padding:5px 12px; margin-top:10px;}
.clickable-hint-top{margin-top:0; margin-bottom:10px;}
.clickable-chart .bar-row{cursor:pointer;}
.modal-filter-chip{font-size:11.5px; padding:4px 11px; border-radius:999px; border:1px solid var(--border); background:#fff; color:var(--text-secondary); cursor:pointer;}
.modal-filter-chip.active{background:var(--series-1); color:var(--ic-dark-blue); border-color:var(--series-1); font-weight:700;}
.modal-toolbar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px;}

/* ---------- MISC ---------- */
.toast{position:fixed; bottom:20px; right:20px; background:#17233c; color:#fff; padding:12px 18px; border-radius:9px; font-size:13px; box-shadow:0 8px 24px rgba(0,0,0,0.2); z-index:100; max-width:340px;}
.tag-row{display:flex; flex-wrap:wrap; gap:6px;}
.tag{font-size:11px; padding:3px 9px; border-radius:999px; background:#eef1f7; color:var(--text-secondary);}
.hr{height:1px; background:var(--grid-line); margin:22px 0;}
@media (max-width:980px){
  .app{flex-direction:column;}
  .sidebar{width:100%; flex:none; height:auto; position:relative; flex-direction:row; overflow-x:auto; align-items:center;}
  .sidebar-brand{border-bottom:none; border-right:1px solid rgba(255,255,255,0.08); flex:0 0 auto;}
  .sidebar-nav{display:flex; padding:10px; flex:1;}
  .nav-group-label{display:none;}
  .nav-link{white-space:nowrap;}
  .sidebar-foot{display:none;}
  .main{padding:18px;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <img class="brand-logo" id="brand-logo" alt="Inchcape" src="">
      <div class="eyebrow">Cono Sur · Comunicaciones</div>
      <div class="title">Dashboard de gestión</div>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-foot" id="sidebar-foot">
      <div id="data-meta"></div>
      <button id="btn-upload">📂 Actualizar datos (subir Excel)</button>
      <button id="btn-reset" style="display:none;">↺ Restaurar datos originales</button>
      <input type="file" id="file-input" accept=".xlsx,.xls">
    </div>
  </aside>
  <main class="main">
    <div id="page-root"></div>
  </main>
</div>
<script src="brand-assets.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
